<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Unit 5 - Flex & Grid</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Divs</h1>
        <div class="boxes">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <h1>Spans (block)</h1>
        <div class="boxes">
            <span class="box span-block"></span>
            <span class="box span-block"></span>
            <span class="box span-block"></span>
        </div>

        <h1>Spans (inline-block)</h1>
        <div class="boxes">
            <span class="box span-inline-block"></span>
            <span class="box span-inline-block"></span>
            <span class="box span-inline-block"></span>
        </div>

        <h1>Flex Column</h1>
        <div class="flex flex-column">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <h1>Flex Row</h1>
        <div class="flex flex-row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <h1>Grid 3x3</h1>
        <div class="grid">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>

</html>
